<section class="chat-panel">
  <header class="chat-header">
    <h3>Berjis AI</h3>
    <div class="model flex items-center gap-2">
      <span>Model: {{ model }}</span>
      <button class="icon-btn" (click)="toggleTheme()" title="Toggle theme">{{ themeIcon }}</button>
    </div>
  </header>
  <div class="chat-body">
    <div *ngFor="let m of messages" class="msg" [class.user]="m.role==='user'" [class.assistant]="m.role==='assistant'">
      <div class="bubble">{{ m.content }}</div>
    </div>
  </div>
  <div class="thinking-divider" *ngIf="sending" aria-live="polite" aria-label="Thinking"></div>
  <footer class="chat-input">
    <div class="ai-frame w-full">
      <div class="ai-inner w-full">
        <input class="chat-text" [placeholder]="placeholder" [(ngModel)]="input" (keyup.enter)="send()" />
        <button *ngIf="!sending" (click)="send()" class="icon-btn" title="Send">
          <span class="material-symbols-outlined">arrow_upward</span>
        </button>
        <button *ngIf="sending" (click)="stop()" class="icon-btn stop" title="Stop">
          <span class="material-symbols-outlined">stop</span>
        </button>
      </div>
    </div>
  </footer>
</section>
